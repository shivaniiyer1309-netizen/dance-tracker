<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log In | RythmFlo</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            font-family: "Segoe UI", Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(218, 184, 255, 0.55),
                    transparent 35%
                ),

                radial-gradient(
                    circle at bottom left,
                    rgba(255, 205, 235, 0.5),
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    #fffafd,
                    #f7f2ff
                );

            color: #27213c;
        }


        .back-home {

            position: absolute;

            top: 28px;
            left: 40px;

            text-decoration: none;

            color: #6c4ba1;

            font-weight: 600;
        }


        .back-home:hover {
            color: #a45294;
        }


        .login-container {

            width: 100%;
            max-width: 430px;

            padding: 20px;
        }


        .logo {

            text-align: center;

            font-size: 32px;
            font-weight: 750;

            color: #6240a8;

            margin-bottom: 25px;
        }


        .logo span {
            color: #b15aa3;
        }


        .login-card {

            background: rgba(255,255,255,0.92);

            border: 1px solid rgba(110, 79, 150, 0.13);

            border-radius: 28px;

            padding: 42px;

            box-shadow:
                0 30px 70px rgba(86,57,130,0.16);

            backdrop-filter: blur(15px);
        }


        .login-card h1 {

            text-align: center;

            font-size: 32px;

            margin-bottom: 10px;
        }


        .subtitle {

            text-align: center;

            color: #81778b;

            font-size: 15px;

            margin-bottom: 32px;

            line-height: 1.5;
        }


        label {

            display: block;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 8px;

            color: #4e455a;
        }


        input {

            width: 100%;

            padding: 14px 15px;

            margin-bottom: 20px;

            border: 1px solid #ded7e7;

            border-radius: 12px;

            background: #fdfcff;

            outline: none;

            font-size: 15px;

            transition: 0.2s;
        }


        input:focus {

            border-color: #805db7;

            box-shadow:
                0 0 0 3px rgba(128,93,183,0.11);
        }


        .login-btn {

            width: 100%;

            border: none;

            padding: 15px;

            border-radius: 30px;

            background:
                linear-gradient(
                    135deg,
                    #6240a8,
                    #ad569e
                );

            color: white;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.25s;

            margin-top: 5px;
        }


        .login-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 12px 28px rgba(98,64,168,0.28);
        }


        .signup-text {

            text-align: center;

            margin-top: 27px;

            color: #81778b;

            font-size: 14px;
        }


        .signup-text a {

            color: #754cac;

            text-decoration: none;

            font-weight: 700;
        }


        .message {

            display: none;

            padding: 12px;

            border-radius: 10px;

            margin-bottom: 20px;

            font-size: 14px;

            text-align: center;
        }


        .error {

            background: #fff0f3;

            color: #a83c54;

            border: 1px solid #ffd3dd;
        }


        .success {

            background: #eefaf2;

            color: #34704a;

            border: 1px solid #caecd6;
        }


        @media(max-width: 500px) {

            .login-card {
                padding: 30px 25px;
            }

            .back-home {
                left: 20px;
            }
        }

    </style>

</head>


<body>


<a href="index.html" class="back-home">
    ← Back to Home
</a>


<div class="login-container">


    <div class="logo">
        Rythm<span>Flo</span>
    </div>


    <div class="login-card">


        <h1>
            Welcome back
        </h1>


        <p class="subtitle">
            Log in to continue managing your dance academy.
        </p>


        <div id="errorMessage"
             class="message error">

            Invalid email or password.

        </div>


        <div id="successMessage"
             class="message success">

            Account created successfully! You can now log in.

        </div>


        <form action="LoginServlet" method="post">


            <label>
                Email Address
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required>


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required>


            <button
                type="submit"
                class="login-btn">

                Log In →

            </button>


        </form>


        <div class="signup-text">

            Don't have an account?

            <a href="register.html">
                Sign up
            </a>

        </div>


    </div>

</div>


<script>

    const params =
        new URLSearchParams(window.location.search);


    if (params.get("error") === "true") {

        document
            .getElementById("errorMessage")
            .style.display = "block";

    }


    if (params.get("registered") === "true") {

        document
            .getElementById("successMessage")
            .style.display = "block";

    }

</script>


</body>
</html>
