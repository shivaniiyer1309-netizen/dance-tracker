
name: Deploy RythmFlo

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: rythmflo-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify database configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'System.getenv("MYSQLPASSWORD")' src/main/java/db/DB.java
          if grep -Eq 'DriverManager.getConnection\([^u]' src/main/java/db/DB.java; then
            echo "Review JDBC configuration before deploying"
          fi
          echo "Environment-based database configuration found"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build WAR
        run: mvn -B clean package -DskipTests

      - name: Verify WAR
        shell: bash
        run: |
          test -s target/DanceTracker.war
          echo "WAR BUILD: SUCCESS"

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::710280691467:role/DanceTracker-GitHubDeploy-Role
          aws-region: us-east-2

      - name: Upload WAR to S3
        shell: bash
        run: |
          aws s3 cp target/DanceTracker.war \
            "s3://rythmflo-deploy-710280691467-us-east-2/releases/${GITHUB_SHA}/DanceTracker.war" \
            --only-show-errors
          echo "S3 UPLOAD: SUCCESS"

      - name: Deploy through AWS Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE="i-0c0d7f40acefe2d9e"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --comment "RythmFlo deployment ${GITHUB_SHA}" \
            --parameters "{\"commands\":[\"sudo /usr/local/sbin/rythmflo-deploy ${GITHUB_SHA}\"]}" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE"; then

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE" \
              --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
              --output json

            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE" \
            --query 'StandardOutputContent' \
            --output text

          echo "GITHUB DEPLOYMENT: SUCCESS"
