
name: Deploy RythmFlo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: rythmflo-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify database source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'System.getenv("MYSQLPASSWORD")' \
            src/main/java/db/DB.java

      - name: Build WAR
        run: mvn -B clean package -DskipTests

      - name: Prepare WAR
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t wars < <(find target -maxdepth 1 \
            -type f -name '*.war' | sort)
          test "${#wars[@]}" -eq 1
          cp "${wars[0]}" /tmp/DanceTracker.war
          test -s /tmp/DanceTracker.war

      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::710280691467:role/DanceTracker-GitHubDeploy-Role
          aws-region: us-east-2

      - name: Upload release to S3
        shell: bash
        run: |
          aws s3 cp /tmp/DanceTracker.war \
            "s3://rythmflo-deploy-710280691467-us-east-2/releases/${GITHUB_SHA}/DanceTracker.war" \
            --only-show-errors

      - name: Deploy using SSM
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE="i-0c0d7f40acefe2d9e"

          ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --parameters "{\"commands\":[\"sudo /usr/local/sbin/rythmflo-deploy ${GITHUB_SHA}\"]}" \
            --timeout-seconds 600 \
            --query 'Command.CommandId' \
            --output text)

          echo "Deployment command ID: $ID"

          STATUS="Pending"

          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$ID" \
              --instance-id "$INSTANCE" \
              --query 'Status' \
              --output text 2>/dev/null) || STATUS="Pending"

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac

            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$ID" \
            --instance-id "$INSTANCE" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json

          test "$STATUS" = "Success"

          echo "RYTHMFLO DEPLOYMENT SUCCESS"
